<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" fill="none" width="100%" height="100%" aria-label="Elmdon Roofing Services Logo">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Architectural Roof Crest Emblem -->
  <g transform="translate(10, 8)">
    <!-- Base Shield Backdrop -->
    <path d="M4 14 L36 2 L68 14 L68 46 C68 62 36 72 36 72 C36 72 4 62 4 46 Z" fill="url(#darkGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Primary Pitch Roof Geometry -->
    <path d="M12 36 L36 15 L60 36" stroke="url(#roofGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Secondary Offset Ridge / Gable Layer -->
    <path d="M20 45 L36 30 L52 45" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Leadwork / Chimney Detail -->
    <path d="M46 22 L46 16 L53 16 L53 28" fill="none" stroke="url(#roofGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Foundation Base Plate -->
    <line x1="20" y1="53" x2="52" y2="53" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center Trust Star -->
    <polygon points="36,58 37.8,63.5 43.5,63.5 38.9,66.8 40.7,72.3 36,69 31.3,72.3 33.1,66.8 28.5,63.5 34.2,63.5" fill="#f59e0b"/>
  </g>

  <!-- Typography -->
  <g transform="translate(94, 26)">
    <!-- Primary Wordmark: ELMDON -->
    <text x="0" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      ELMDON
    </text>
    
    <!-- Accent Dot -->
    <circle cx="152" cy="18" r="4.5" fill="#f59e0b"/>

    <!-- Subtitle Wordmark: ROOFING SERVICES -->
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3" fill="#f59e0b" text-transform="uppercase">
      ROOFING SERVICES
    </text>

    <!-- Geographic & Heritage Tag -->
    <text x="180" y="44" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#94a3b8" text-transform="uppercase">
      BIRMINGHAM • SOLIHULL
    </text>
  </g>
</svg>
